# Project information
site_name: C/C++ Craft
site_url: https://guihui-huimy.github.io/CorCraft/
site_author: HUI-MY
site_description: >-
  A memory-first, laboratory-style course in C and C++ that ends in protein structure computation.

# Repository
repo_name: GuiHui-huimy/CorCraft
repo_url: https://github.com/GuiHui-huimy/CorCraft
edit_uri: edit/main/docs/

# Copyright
copyright: Copyright &copy; 2026 HUIMY - C/C++ Craft

# Configuration
theme:
  name: material
  custom_dir: docs/material/overrides
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.tabs
    - navigation.autohide
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/link
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/toggle-switch
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/toggle-switch-off
        name: Switch to system preference
  font: false
  favicon: assets/favicon.png
  icon:
    logo: material/flask

extra_css:
  - assets/fonts/roboto.css
  - assets/fonts/roboto-mono.css
  - assets/stylesheets/extra.css
  - material/overrides/assets/stylesheets/home.css




# Plugins
plugins:
  # - blog     # 如果暂时不需要博客可以注释掉
  - search:
      separator: '[\s\u200b\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true

# Hooks
hooks:
  - docs/material/overrides/hooks/shortcodes.py
  - docs/material/overrides/hooks/translations.py

# Additional configuration
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GuiHui-huimy/CorCraft
    - icon: fontawesome/solid/globe
      link: https://www.huimy.top          # 主站
    - icon: fontawesome/solid/newspaper
      link: https://blog.huimy.top              # 博客
    - icon: fontawesome/solid/comments
      link: https://comm.huimy.top             # 社区
    - icon: fontawesome/solid/flask
      link: https://lab.huimy.com        # 实验室

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: GuiHui-huimy
      repo: CorCraft
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      auto_append:
        - includes/mkdocs.md
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

